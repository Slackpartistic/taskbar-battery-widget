name: Test build

# Builds a portable .exe from any branch so changes can be tried before a release.
# Unsigned and not a release: download it from the run's artifacts.
on:
  push:
    branches-ignore: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest -q

      - name: Install Inno Setup
        shell: pwsh
        run: |
          $found = @("${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe", "$env:ProgramFiles\Inno Setup 6\ISCC.exe") |
            Where-Object { Test-Path -LiteralPath $_ }
          if (-not $found) {
            choco install innosetup --version 6.7.1 -y --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'choco install innosetup failed' }
          }

      - name: Build
        shell: pwsh
        run: ./packaging/build.ps1 -SkipTests

      - name: Upload portable build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: TaskbarBatteryWidget-portable
          path: dist/TaskbarBatteryWidget-portable-*.exe
          if-no-files-found: error
          retention-days: 14
